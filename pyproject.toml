[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cantina-familiar"
version = "2.0.0"
description = "Sistema de Apoyo a la Decisión de Compra Navideña y Análisis Comparativo de Precios de Bebidas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cantina Familiar Team" }
]
keywords = [
    "decision-support",
    "pricing-analysis",
    "beverages",
    "tequila",
    "mezcal",
    "whisky",
    "vino",
    "multistore",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/scraper_selenium.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "legacy",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "E402"]
