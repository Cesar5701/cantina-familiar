name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 3
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        timeout-minutes: 5
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Validar linting y formato con Ruff
        timeout-minutes: 3
        run: |
          ruff check .
          ruff format --check .

      - name: Regenerar Catálogos y Dashboard
        timeout-minutes: 5
        run: |
          python src/actualizar_dashboard_completo.py
          python src/generar_dashboard.py

      - name: Ejecutar pruebas unitarias y cobertura
        timeout-minutes: 5
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Preparar sitio (solo el dashboard publicado)
        timeout-minutes: 2
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        timeout-minutes: 2

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        timeout-minutes: 3
        with:
          path: '_site'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        timeout-minutes: 3
