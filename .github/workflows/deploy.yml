name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2

      - name: Configurar Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        timeout-minutes: 3
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        timeout-minutes: 5
        run: |
          pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Validar linting y formato con Ruff
        timeout-minutes: 3
        run: |
          ruff check .
          ruff format --check .

      - name: Regenerar Catálogos y Dashboard
        timeout-minutes: 5
        run: |
          python src/actualizar_dashboard_completo.py
          python src/generar_dashboard_v4.py

      - name: Ejecutar pruebas unitarias y cobertura
        timeout-minutes: 5
        run: pytest -v --cov=src --cov-report=term-missing

      - name: Preparar sitio (solo el dashboard publicado)
        timeout-minutes: 2
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        timeout-minutes: 2

      - name: Subir artefacto para Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        timeout-minutes: 3
        with:
          path: '_site'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        timeout-minutes: 3
