  <!-- ZERO-FLICKER TAB PRE-RENDER (Evita FOUC al recargar en una pestaña secundaria) -->
  <script>
    (function() {
      try {
        var h = decodeURIComponent(String(location.hash || "").replace(/^#/, "")).trim().toLowerCase().replace(/^tab-/, "");
        var validas = ["versus", "carrito", "matriz"];
        if (validas.indexOf(h) !== -1) {
          var s = document.createElement("style");
          s.id = "tab-preload-style";
          s.textContent = "#tab-rankings{display:none !important;}#tab-" + h + "{display:block !important;}" +
                          "#btn-tab-rankings{background-color:transparent !important;color:#574A3D !important;box-shadow:none !important;}" +
                          "#btn-tab-" + h + "{background-color:#ffffff !important;color:#1F1B16 !important;box-shadow:0 1px 2px 0 rgba(0,0,0,0.05) !important;}" +
                          "#mob-btn-tab-rankings{color:#8A7B6B !important;font-weight:500 !important;}" +
                          "#mob-btn-tab-" + h + "{color:#784516 !important;font-weight:700 !important;}";
          document.head.appendChild(s);
        }
      } catch (e) {}
    })();
  </script>
