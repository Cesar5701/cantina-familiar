  <!-- CABECERA EDITORIAL Y BARRA DE NAVEGACIÓN DE REGISTRO (STITCH ARCHIVAL LEDGER) -->
  <header class="sticky top-0 z-50 w-full bg-[#fff8f3]/95 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.04)] border-b border-[#efe1cd]">
    <div class="max-w-[1440px] mx-auto px-4 lg:px-8">
      <!-- Fila Superior: Identidad Editorial & Parámetros Globales Reactivos -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3 gap-3.5 border-b border-[#d7c2b9]/40">
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded bg-primary-container flex items-center justify-center text-on-primary shadow-sm flex-shrink-0">
              <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">liquor</span>
            </div>
            <div>
              <h1 class="font-headline text-2xl font-bold tracking-tight text-[#211b0f] leading-none">Cantina Familiar</h1>
              <p class="font-mono text-[10px] uppercase tracking-[0.16em] text-[#52443c] mt-1">Registro Auditado de Destilados y Vinos · Ed. 2026</p>
            </div>
          </div>
          <div class="hidden xl:flex items-center gap-2 pl-4 border-l border-[#d7c2b9]/50">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-surface-container text-[#52443c] font-mono text-[11px] font-medium border border-[#d7c2b9]/60">
              <span class="w-1.5 h-1.5 rounded-full bg-[#3d7042]"></span>
              Auditado • 6 Cadenas Verificadas • 827 SKUs
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-[#eaf4ec] text-[#24592a] font-mono text-[10px] font-bold border border-[#c5dfc9]">
              Corte: __CORTE_AUDITORIA__
            </span>
          </div>
        </div>

        <!-- Controles Interactivos Globales: Presupuesto & Cooperadores -->
        <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2.5 sm:gap-3">
          <div class="flex items-center bg-surface-container border border-outline-variant/80 rounded px-3 py-1.5 gap-2.5">
            <span class="material-symbols-outlined text-primary text-[18px] hidden sm:inline">payments</span>
            <div class="flex flex-col min-w-0 flex-1">
              <label for="input-presupuesto-global" class="font-mono text-[10px] uppercase tracking-wider text-on-surface-variant leading-none mb-1 cursor-pointer">
                Presupuesto ($ MXN)
              </label>
              <div class="flex items-center gap-1">
                <span class="font-mono text-xs font-bold text-primary select-none">$</span>
                <input type="number" id="input-presupuesto-global" value="" min="0" max="200000" step="100"
                       placeholder="Ej. 8500"
                       oninput="actualizarParametrosGlobales()"
                       class="w-full sm:w-28 bg-white/80 border border-[#d7c2b9] rounded px-2 py-0.5 font-mono text-xs sm:text-sm font-bold text-[#211b0f] focus:outline-none focus:border-primary">
              </div>
            </div>
          </div>

          <div class="flex items-center bg-surface-container border border-outline-variant/80 rounded px-3 py-1.5 gap-2.5">
            <span class="material-symbols-outlined text-secondary text-[18px] hidden sm:inline">groups</span>
            <div class="flex flex-col min-w-0 flex-1">
              <label for="input-cooperadores-global" class="font-mono text-[10px] uppercase tracking-wider text-on-surface-variant leading-none mb-1 cursor-pointer">
                Personas (N)
              </label>
              <div class="flex items-center gap-1">
                <input type="number" id="input-cooperadores-global" value="" min="1" max="200" step="1"
                       placeholder="Ej. 14"
                       oninput="actualizarParametrosGlobales()"
                       class="w-full sm:w-20 bg-white/80 border border-[#d7c2b9] rounded px-2 py-0.5 font-mono text-xs sm:text-sm font-bold text-[#211b0f] text-center focus:outline-none focus:border-primary">
                <span class="font-mono text-[10px] text-on-surface-variant hidden sm:inline">pers.</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Fila Inferior: Pestañas de Navegación Desktop & Estado de las 6 Cadenas -->
      <div class="hidden md:flex items-center justify-between overflow-x-auto">
        <nav class="flex items-center gap-1 py-1.5" aria-label="Navegación principal del registro">
          <button onclick="cambiarTab('tab-rankings')" id="btn-tab-rankings" class="tab-btn px-4 py-2 rounded bg-[#8c5332] text-white font-semibold shadow-sm text-sm transition-all flex items-center gap-2 whitespace-nowrap cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">analytics</span>
            <span class="font-mono text-[11px] opacity-80">01</span>
            <span>Catálogo &amp; Rankings $/L</span>
          </button>

          <button onclick="cambiarTab('tab-versus')" id="btn-tab-versus" class="tab-btn px-4 py-2 rounded text-[#52443c] hover:text-[#211b0f] hover:bg-[#faecd8] text-sm font-medium transition-colors flex items-center gap-2 whitespace-nowrap cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">compare_arrows</span>
            <span class="font-mono text-[11px] text-primary font-bold">02</span>
            <span>Duelo Head-to-Head</span>
          </button>

          <button onclick="cambiarTab('tab-carrito')" id="btn-tab-carrito" class="tab-btn px-4 py-2 rounded text-[#52443c] hover:text-[#211b0f] hover:bg-[#faecd8] text-sm font-medium transition-colors flex items-center gap-2 whitespace-nowrap cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">shopping_bag</span>
            <span class="font-mono text-[11px] text-primary font-bold">03</span>
            <span>Carrito &amp; Armador</span>
            <span class="ml-0.5 px-1.5 py-0.5 rounded bg-secondary-container text-on-secondary-fixed font-mono text-[10px] font-bold border border-[#d7c2b9]" id="badge-nav-carrito-count">0</span>
          </button>

          <button onclick="cambiarTab('tab-matriz')" id="btn-tab-matriz" class="tab-btn px-4 py-2 rounded text-[#52443c] hover:text-[#211b0f] hover:bg-[#faecd8] text-sm font-medium transition-colors flex items-center gap-2 whitespace-nowrap cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">menu_book</span>
            <span class="font-mono text-[11px] text-primary font-bold">04</span>
            <span>Guía de Barricas</span>
          </button>
        </nav>

        <!-- Tira de Vigencias y Estado de las 6 Cadenas Auditadas -->
        <div class="hidden lg:flex items-center gap-3 font-mono text-[11px] text-on-surface-variant">
          <span class="uppercase tracking-wider text-[10px] text-outline">Vigencias:</span>
          <span class="inline-flex items-center gap-1" title="Bodegas Alianza: Aniversario Web hasta 25 Oct 2026"><span class="w-1.5 h-1.5 rounded-full bg-[#3d7042]"></span>Alianza (25 Oct)</span>
          <span class="inline-flex items-center gap-1" title="Sam's Club: Cuponera hasta 2 Nov 2026"><span class="w-1.5 h-1.5 rounded-full bg-[#3d7042]"></span>Sam's (2 Nov)</span>
          <span class="inline-flex items-center gap-1" title="Costco: Cuponera Ahorros hasta 31 Oct 2026"><span class="w-1.5 h-1.5 rounded-full bg-[#3d7042]"></span>Costco (31 Oct)</span>
          <span class="inline-flex items-center gap-1" title="Chedraui: Quincena MiChedraui hasta 31 Oct 2026"><span class="w-1.5 h-1.5 rounded-full bg-[#3d7042]"></span>Chedraui (31 Oct)</span>
          <span class="inline-flex items-center gap-1" title="Soriana: Folleto Licores hasta 22 Oct 2026"><span class="w-1.5 h-1.5 rounded-full bg-[#3d7042]"></span>Soriana (22 Oct)</span>
          <span class="inline-flex items-center gap-1" title="Walmart: Rebajas en Línea hasta 31 Oct 2026"><span class="w-1.5 h-1.5 rounded-full bg-[#3d7042]"></span>Walmart (31 Oct)</span>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-[1440px] mx-auto px-4 lg:px-8 pt-6 pb-12 space-y-6">
